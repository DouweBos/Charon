name: Bug report
description: Something in Charon doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security issue, don't file it here; see SECURITY.md.
        If an offload or Move back was interrupted, don't delete anything by hand before reading docs/offload.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan the startup disk
        2. Open Largest Files
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analyze (scan, Map, Rings, Largest Files, Changes, Duplicates)
        - Scan as Administrator
        - Offload or Move back
        - Clean
        - Uninstall
        - Optimize
        - Menu bar monitor
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: charon-version
    attributes:
      label: Charon version or commit
      description: Charon → About Charon, or `git rev-parse --short HEAD` if you built it yourself.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 26.2 (Apple silicon)
    validations:
      required: true
  - type: textarea
    id: disks
    attributes:
      label: Disks involved
      description: For scan or offload issues, the disk types and formats (internal APFS, external APFS/exFAT/HFS+, network share).
  - type: checkboxes
    id: fda
    attributes:
      label: Permissions
      options:
        - label: Charon has Full Disk Access
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Console.app, filtered on subsystem `dev.houwert.charon`. Remove any paths you don't want to share."
      render: text
